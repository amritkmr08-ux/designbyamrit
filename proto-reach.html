<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit with intent — doc editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(q,h){ if(/[?&]embed/.test(q) || location.protocol==='about:') h.classList.add('embed');
  if(/[?&]paper/.test(q)){ h.classList.add('paper'); var l=document.createElement('link'); l.rel='stylesheet'; l.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@400;500&display=swap'; document.head.appendChild(l); }
  if(/[?&]card/.test(q)) h.classList.add('card'); if(/[?&]bare/.test(q)) h.classList.add('bare'); if(/[?&]stage/.test(q)) h.classList.add('onstage'); })('?embed&paper&bare', document.documentElement);</script>
<style>
:root{
  /* Sirion DS 2.0 dark chrome, white page — the same tokens as the doc-editor prototype */
  --bg-base:#000; --bg-primary:#1a1a19; --bg-secondary:#272726; --bg-tertiary:#323230;
  --border-primary:#444341; --border-secondary:#2f2f2d; --border-tertiary:#252523;
  --text-strong:#ffffff; --text-2:#c3c2b8; --text-3:#8a8984; --text-4:#6e6c68;
  --brand:#86aeb3; --brand-500:#5e949a; --brand-solid:#0d5e68; --yellow:#facc15;
  --page-bg:#ffffff; --page-ink:#252525;
  --del:#6e6c68; --ins:#0d5e68;
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --text-xs:12px; --text-sm:13px;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --doc:"Geist",-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow-lg:0 4px 6px -2px rgba(0,0,0,.3),0 18px 44px -4px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0; background:#FFFFFF; color:var(--text-2); font-family:var(--sans); -webkit-font-smoothing:antialiased}

.unit{max-width:1000px; margin:0 auto; padding:120px 24px 160px}
.u-title{font-size:26px; line-height:1.2; font-weight:600; color:#F2F2F0; margin:0 0 8px; letter-spacing:-.01em}
.u-kicker{font-family:var(--mono); font-size:11.5px; color:var(--text-3); letter-spacing:.02em; margin:0 0 26px}
.u-kicker b{color:var(--text-4); font-weight:400}

/* ---------- the editor: just the document ---------- */
.stage{position:relative; background:#141414; border:1px solid #2A2A2A; border-radius:16px; overflow:hidden}
.doctoolbar{height:44px;flex:0 0 44px;display:flex;align-items:center;gap:24px;padding:0 24px;background:var(--bg-primary);border-bottom:1px solid var(--border-tertiary);position:relative;z-index:5}
.doctoolbar .spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--text-2);background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans)}
.tbtn:hover{color:var(--text-strong)}
.fmtbar{display:flex;align-items:center;gap:2px;opacity:.4;pointer-events:none}
.fmtbar button{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--text-2);background:none;border:0;padding:0}
.fmtbar button.on{background:var(--bg-tertiary);color:var(--text-strong)}
.fmtbar .sep{width:1px;height:16px;background:var(--border-secondary);margin:0 6px}
.canvas{padding:36px 0 280px; background:#f0efed; height:min(700px, 78vh); overflow-y:auto; scrollbar-width:thin}
.canvas .page{margin:0 auto}
.page{
  width:632px; background:var(--page-bg); color:var(--page-ink); font-family:var(--doc);
  font-size:13px; line-height:20px; padding:36px 80px 48px 56px; border-radius:2px;
  box-shadow:0 0 0 1px rgba(0,0,0,.06); user-select:text;
}
.page h3{font-size:14px; font-weight:600; margin:0 0 14px}
.page h4{font-size:12px; font-weight:600; margin:22px 0 10px; letter-spacing:.02em}
.page p{position:relative; isolation:isolate; margin:0 0 12px; padding:5px 24px; margin-left:-24px; margin-right:-24px; transition:box-shadow .3s ease}
.page p::before{content:''; position:absolute; inset:3px 0; z-index:-1; pointer-events:none; border:1px solid transparent; border-radius:8px; transition:background .12s, border-color .12s}
.page p.sel::before{background:rgba(134,174,179,.10)}
.page p.pending::before{box-shadow:inset 3px 0 0 var(--brand-500)}
.page p.drafting{animation:draftpulse 1.3s ease-in-out infinite}
@keyframes draftpulse{0%,100%{opacity:1}50%{opacity:.45}}
::selection{background:#cfe3ea}

/* the proposal, in place — the same redline grammar as the doc-editor prototype */
.page del{color:var(--del); text-decoration:line-through; text-decoration-color:var(--del)}
.page ins{color:var(--ins); text-decoration:none}
.page p.landing del,.page p.landing ins{animation:land .5s ease both}
@keyframes land{from{opacity:0}to{opacity:1}}
/* an edit stays visible for good; hover it for who, when and why */
.page p.was ins,.page p.was del{cursor:default; border-radius:2px; transition:background .15s}
.page p.was ins:hover,.page p.was del:hover,.page p.was.lit ins,.page p.was.lit del{background:rgba(53,121,129,.10)}

/* the orbit at the page's edge: the same as Ask AI to help here, for the paragraph under the pointer */
.orb{position:fixed; z-index:60; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; cursor:pointer;
  opacity:0; transform:scale(.7); pointer-events:none; transition:opacity .18s ease, transform .25s var(--ease), background .12s}
.orb.in{opacity:1; transform:none; pointer-events:auto}
.orb:hover{background:rgba(0,0,0,.05)}


/* an accepted change keeps its reason — a quiet tick beside the paragraph, the record one click away */


/* ---------- the orbit mark ---------- */
.orbit{flex:0 0 auto}
.orbit.spin{animation:orbitspin 2.6s linear infinite}
@keyframes orbitspin{to{transform:rotate(360deg)}}

/* ---------- floating surfaces: the same card grammar as the category menu ---------- */
.menu{
  position:fixed; z-index:70; width:300px; border-radius:var(--r-lg); background:var(--bg-primary);
  border:1px solid var(--border-tertiary); box-shadow:var(--shadow-lg); overflow:hidden; font-family:var(--sans);
  opacity:0; transform:translateY(6px) scale(.985); transform-origin:top left; pointer-events:none;
  transition:opacity .18s ease, transform .28s var(--ease);
}
.menu.in{opacity:1; transform:none; pointer-events:auto}
.menu.out{opacity:0; transform:translateY(4px); transition:opacity .14s ease, transform .18s ease}
.shim{background:linear-gradient(90deg,var(--text-strong) 0%,var(--text-strong) 35%,var(--text-4) 60%,var(--text-strong) 85%);
  background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:aishimmer 1.6s linear infinite}
@keyframes aishimmer{from{background-position:120% 0}to{background-position:-100% 0}}

/* one floating surface: collapsed = a row you click; open = the prompt with suggestions */
#prompt{width:auto; min-width:0; transform-origin:top left}
#prompt.open{width:332px}
/* collapsed: a selection toolbar (Medium / Docs). formatting first, Ask AI last — it is the item that grows into the prompt */
#prompt .tb{display:flex; align-items:center; gap:2px; height:36px; padding:0 4px; white-space:nowrap}
.tbi{width:28px; height:28px; border-radius:var(--r-sm); display:grid; place-items:center; color:var(--text-2); background:none; border:0; padding:0; cursor:pointer; font:inherit; font-size:13px; transition:background .12s, color .12s}
.tbi:hover{background:var(--bg-secondary); color:var(--text-strong)}
.tbi b{font-weight:700} .tbi i{font-family:var(--sans)} .tbi u{text-underline-offset:2px}
.tsep{width:1px; height:16px; background:var(--border-secondary); margin:0 4px}
.tai{display:flex; align-items:center; gap:7px; height:28px; padding:0 10px 0 8px; border-radius:var(--r-sm); border:0; background:none; color:var(--text-strong); font:inherit; font-size:var(--text-sm); font-weight:500; cursor:pointer; transition:background .12s}
.tai:hover{background:var(--bg-secondary)}
.page b{font-weight:600} .page i{font-style:italic} .page u{text-decoration:underline; text-underline-offset:2px}
.page a.lnk{color:#0d5e68; text-decoration:underline; text-underline-offset:2px}
.page p .ph{color:rgba(0,0,0,.34)}


/* the ripple: a chip at the end of the edited clause, a mark on the clause it reaches */
.page p .also{display:table; margin:8px 0 2px; padding:1px 8px; border-radius:999px; font-family:var(--sans); font-style:normal; font-size:11px; line-height:16px;
  color:#8a5a00; background:rgba(250,204,21,.22); border:1px solid rgba(250,204,21,.55); cursor:pointer; white-space:nowrap; user-select:none;
  opacity:0; transform:translateY(2px); transition:opacity .25s ease, transform .3s var(--ease), background .12s}
.page p .also.in{opacity:1; transform:none}
.page p .also:hover{background:rgba(250,204,21,.4)}
.page p .ripdot{position:absolute; left:7px; top:11px; width:8px; height:8px; border-radius:50%; background:#f5b400; box-shadow:0 0 0 3px rgba(250,204,21,.25); cursor:pointer;
  opacity:0; transform:scale(.4); transition:opacity .25s ease, transform .35s var(--ease)}
.page p .ripdot.in{opacity:1; transform:none}
.page p .ripdot:hover{box-shadow:0 0 0 5px rgba(250,204,21,.35)}
.menu.rec.wide{max-width:300px}
.rec .rin.one b{color:var(--text-strong); font-weight:500}

/* the gap between two paragraphs (Medium): a line with a + in the middle, only while the pointer is in that gap */
.gap{position:fixed; z-index:55; height:14px; opacity:0; pointer-events:none; transition:opacity .15s ease}
.gap::before{content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--brand-500); opacity:.55}
.gap.in{opacity:1; pointer-events:auto}
.gap .plus{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:20px; height:20px; border-radius:50%; background:#fff; border:1px solid var(--brand-500); color:var(--brand-500);
  display:grid; place-items:center; cursor:pointer; transition:background .12s, color .12s, transform .2s var(--ease)}
.gap .plus:hover{background:var(--brand-500); color:#fff; transform:translate(-50%,-50%) scale(1.08)}
.aiprompt{display:flex; align-items:center; gap:10px; height:40px; padding:0 10px 0 12px; border-bottom:1.5px solid transparent;
  border-image:linear-gradient(90deg,#357981,#6172f3 55%,#d92d20) 1}
.aiprompt input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text-strong); font:inherit; font-size:var(--text-sm)}
.aiprompt input::placeholder{color:var(--text-4)}
.aiprompt .send{width:24px; height:24px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; color:var(--brand-500); cursor:pointer; transition:background .12s}
.aiprompt .send:hover{background:var(--bg-tertiary)}
.aithink{margin:10px; height:34px; display:flex; align-items:center; padding:0 12px; border-radius:var(--r-md); font-size:var(--text-xs);
  background:linear-gradient(90deg,rgba(59,130,246,.12),rgba(139,92,246,.10) 50%,rgba(239,68,68,.06))}
.mlist{padding:6px; animation:airise .22s var(--ease) both}
@keyframes airise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.mitem{display:flex; align-items:center; width:100%; min-height:34px; padding:7px 10px; border:0; border-radius:var(--r-sm); background:none; color:var(--text-2);
  font:inherit; font-size:var(--text-sm); text-align:left; cursor:pointer; line-height:1.35; transition:background .12s, color .12s}
.mitem:hover{background:var(--bg-secondary); color:var(--text-strong)}
#prompt .mitem{flex-direction:column; align-items:flex-start; justify-content:center; gap:1px; text-align:left}
#prompt .mitem small{font-size:11px; color:var(--text-4); line-height:1.3; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#prompt .mitem > span{max-width:100%}
#prompt .mitem .mt{display:flex; align-items:flex-start; gap:12px; width:100%}
#prompt .mitem .mt > span{text-wrap:pretty; hyphens:manual}
#prompt .mitem .mt .pb{margin-top:1px}
#prompt .mitem .mt > span{flex:1; min-width:0}
.pb{flex:0 0 auto; font-style:normal; font-size:10.5px; line-height:16px; padding:0 6px; border-radius:4px; font-weight:500; letter-spacing:.01em; white-space:nowrap}
.pb.std{color:#9cc3c8; background:rgba(134,174,179,.14)}
.pb.fb{color:#f5cf4a; background:rgba(250,204,21,.11)}
.pb.off{color:#f98b82; background:rgba(249,112,102,.13)}
.pb.q{color:var(--text-3); background:var(--bg-tertiary)}
.rec .tt-meta .pb{display:inline-block; line-height:16px}
/* a ripple follow-up: why it opened here, and the one fix */
.fix{padding:6px; animation:airise .22s var(--ease) both}
.fwhy{display:flex; gap:9px; align-items:flex-start; padding:8px 10px 10px; font-size:var(--text-xs); line-height:1.45; color:var(--text-3)}
.fwhy i{flex:0 0 7px; height:7px; margin-top:5px; border-radius:50%; background:#f5b400; box-shadow:0 0 0 3px rgba(250,204,21,.18)}
.fix .fixrow{background:var(--bg-secondary)}
.fix .fixrow:hover,.fix .fixrow.fhover{background:var(--bg-tertiary)}
/* an answer, in place of the list */
.aans{padding:12px 14px 2px; animation:airise .22s var(--ease) both}
.aans .aq{font-size:11px; color:var(--text-3); margin:0 0 6px}
.aans p{margin:0 0 10px; font-size:var(--text-sm); line-height:1.5; color:var(--text-2)}
.aans p b{color:var(--text-strong); font-weight:500}
.acites{display:flex; flex-direction:column; gap:3px; margin:0 0 10px; padding-left:10px; border-left:2px solid var(--border-secondary)}
.acites span{font-size:11px; line-height:1.4; color:var(--text-3)}
.aacts{display:flex; flex-wrap:wrap; gap:6px; padding:10px; border-top:1px solid var(--border-tertiary)}
.abtn{height:28px; padding:0 10px; border-radius:var(--r-sm); border:1px solid var(--border-secondary); background:var(--bg-secondary); color:var(--text-strong); font:inherit; font-size:var(--text-xs); cursor:pointer; transition:background .12s}
.abtn:hover{background:var(--bg-tertiary)}
.abtn.quiet{background:none; border-color:transparent; color:var(--text-3)}
.abtn.quiet:hover{color:var(--text-strong); background:var(--bg-secondary)}
.abtn{display:inline-flex; align-items:center; gap:6px}
.abtn .pb{font-size:10px; line-height:15px}
#prompt .mitem:hover small{color:var(--text-3)}
.mempty{padding:10px 12px; font-size:var(--text-xs); color:var(--text-4)}

/* 3. the card: drafting → proposed */
.menu.aicard{width:300px}
.aicard .abar{display:flex; align-items:center; gap:4px; padding:6px 8px}
.aicard .abar .mitem{width:auto; min-height:30px; padding:0 10px}
.aicard .abar .atitle{flex:1; min-width:0; font-size:var(--text-sm); font-weight:600; color:var(--text-strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px}
.aicard .revert{display:block; width:100%; text-align:left; background:none; border:0; border-top:1px solid var(--border-tertiary); padding:9px 14px 10px; font:inherit; font-size:var(--text-xs); color:var(--text-3); cursor:pointer; transition:color .12s, background .12s}
.aicard .revert:hover{color:var(--text-strong); background:var(--bg-secondary)}
.arefine .orbit{flex:0 0 14px}
.rec a.quiet{color:var(--text-3); margin-left:10px}
.aicard .abar .more{width:28px; height:28px; border-radius:var(--r-sm); border:0; background:none; color:var(--text-3); cursor:pointer; display:grid; place-items:center; transition:background .12s, color .12s, transform .25s var(--ease)}
.aicard .abar .more:hover{background:var(--bg-secondary); color:var(--text-strong)}
.aicard.open .abar .more{transform:rotate(180deg)}
.aicard .abody{overflow:hidden}
.aicard .abody .awhat{padding-top:2px}
.ainner{transition:opacity .18s ease}
.ainner.fade{opacity:0}
.ahead{display:flex; align-items:center; gap:8px; padding:12px 14px 0}
.ahead .k{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.ahead .orbit{margin-left:auto}
.aicard h4{margin:6px 0 4px; padding:0 14px; font-size:var(--text-sm); font-weight:600; color:var(--text-strong); line-height:1.3}
.awhat{margin:0; padding:0 14px 10px; font-size:var(--text-xs); line-height:1.5; color:var(--text-2)}
.anote{margin:0 14px 12px; padding:8px 10px; border-radius:var(--r-sm); background:var(--bg-secondary); border-left:2px solid var(--yellow); font-size:var(--text-xs); line-height:1.45; color:var(--text-2)}
.anote b{color:var(--text-strong); font-weight:500}
.anote a{color:var(--brand); text-decoration:none}
.arow{display:flex; align-items:center; gap:4px; padding:8px 10px; border-top:1px solid var(--border-tertiary)}
.arow .mitem{width:auto; min-height:30px; padding:0 10px}
.btn-primary{margin-left:auto; display:inline-flex; align-items:center; height:30px; padding:0 14px; border-radius:var(--r-md); border:1px solid transparent;
  background:var(--brand-solid); color:#fff; font:inherit; font-size:var(--text-xs); font-weight:500; cursor:pointer; transition:background .12s, opacity .2s}
.btn-primary:hover{background:#0b5059}
.btn-primary:disabled{opacity:.4; cursor:default}
.arefine{display:flex; align-items:center; gap:8px; margin:4px 10px 10px; height:32px; padding:0 10px; border-radius:var(--r-md); border:1px solid var(--border-secondary)}
.arefine input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text-strong); font:inherit; font-size:var(--text-xs)}
.arefine input::placeholder{color:var(--text-4)}
.arefine span{font-size:10px; color:var(--text-4)}
.skel{padding:2px 14px 14px; display:flex; flex-direction:column; gap:8px}
.skel i{display:block; height:9px; border-radius:4px; background:linear-gradient(90deg,var(--bg-secondary) 0%,var(--bg-tertiary) 50%,var(--bg-secondary) 100%); background-size:220% 100%; animation:aishimmer 1.4s linear infinite}
.skel i:nth-child(2){animation-delay:.12s} .skel i:nth-child(3){animation-delay:.24s}
.menu.aicard{transition:opacity .18s ease, transform .28s var(--ease), height .26s var(--ease)}

/* 4. the record */
.menu.rec{width:max-content; max-width:300px; border-radius:var(--r-md); transform-origin:bottom left}
.rec .rin.one{padding:8px 11px 9px; font-size:var(--text-xs); line-height:1.4; color:var(--text-2); white-space:normal}
.rec .tt-what{display:block; color:var(--text-strong); font-weight:500; font-size:12.5px; line-height:1.35}
.rec .tt-meta{display:flex; align-items:center; gap:7px; margin-top:6px; color:var(--text-3); font-size:11px; line-height:16px}
.rec .tt-src{display:block; margin-top:3px; color:var(--text-4); font-size:11px; line-height:1.4}
.rec .tt-what{text-wrap:balance}
.rec .rin{padding:14px 16px 14px}
.rec .k{color:var(--yellow) !important; font-size:11px; letter-spacing:.08em}
.rec h6{font-size:14px !important; margin:4px 0 4px !important}
.rec .meta{font-size:var(--text-sm) !important; margin:0 0 14px !important}
.rec .askbar{display:flex; align-items:center; gap:10px; height:44px; padding:0 8px 0 14px; border-radius:999px; background:var(--bg-secondary); border:1px solid var(--border-secondary); margin:0 0 2px}
.rec .askbar input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--text-strong); font:inherit; font-size:var(--text-sm)}
.rec .askbar input::placeholder{color:var(--text-3)}
.rec .askbar .send{width:28px; height:28px; border-radius:50%; border:0; background:var(--bg-tertiary); color:var(--text-2); display:grid; place-items:center; cursor:pointer}
.rec .askbar .send:hover{background:var(--brand-solid); color:#fff}
.rec a.quiet{display:block; text-align:right; margin:0 0 12px; color:var(--text-3)}
.rec .anote{margin:0 0 12px; padding:8px 10px; border-radius:var(--r-sm); background:var(--bg-secondary); border-left:2px solid var(--yellow); font-size:var(--text-xs); line-height:1.45; color:var(--text-2)}
.rec .anote b{color:var(--text-strong); font-weight:500}
.rec .anote a{color:var(--brand); text-decoration:none}
.rec .k{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin:0 0 6px}
.rec h6{font-size:var(--text-sm); font-weight:600; color:var(--text-strong); margin:0 0 4px}
.rec .meta{font-size:var(--text-xs); line-height:1.5; color:var(--text-3); margin:0 0 10px}
.rec .meta b{color:var(--text-2); font-weight:500}
.rec a{color:var(--brand); text-decoration:none; font-size:var(--text-xs)}
.rec .steps{margin:-4px 0 10px; padding:0 0 0 14px; font-size:var(--text-xs); line-height:1.5; color:var(--text-3)}
.rec .steps li{margin:2px 0}
.rec a:hover{text-decoration:underline}

.toast{position:fixed; left:50%; bottom:28px; transform:translate(-50%,8px); z-index:95; padding:8px 14px; border-radius:var(--r-md); background:var(--bg-tertiary); color:var(--text-strong);
  font-size:var(--text-xs); box-shadow:var(--shadow-lg); opacity:0; transition:opacity .2s, transform .2s; pointer-events:none}
.toast.in{opacity:1; transform:translate(-50%,0)}
/* ---------- embedded on the index: no title of its own ---------- */
html.embed, html.embed body{background:#FFFFFF}
html.embed .unit{padding:0 0 8px; max-width:none}
html.embed .u-title, html.embed .u-kicker{display:none}
html.embed .canvas{height:600px}

/* ---------- the loop ---------- */

.demobar.driving .steps span{color:#5E5E5C} .demobar.driving .steps i::after{transform:scaleX(0); transition:none}
.dstat{display:flex; align-items:center; gap:10px; height:28px; font-size:12.5px; color:#8E8E89; white-space:nowrap}

.dstat .replay{display:none; align-items:center; gap:6px; height:28px; padding:0 11px 0 9px; border-radius:7px; border:1px solid #2E2E2E; background:#161616; color:#F2F2F0; font:inherit; font-size:12px; cursor:pointer; transition:background .15s, border-color .15s}

/* 5.2A between 5.2 and 5.3; 5.4 after the last clause of the section */
function nextNum(p){
  const m = (p.dataset.num || p.textContent).match(/^(\d+)\.(\d+)([A-Z]?)/); if(!m) return '';
  const nx = p.nextElementSibling, nxIsClause = nx && nx.matches('p[data-id]');
  if(nxIsClause) return m[1] + '.' + m[2] + (m[3] ? String.fromCharCode(m[3].charCodeAt(0)+1) : 'A');
  return m[1] + '.' + (+m[2] + 1);
}
function insertAfter(p, prefill, fix){
  const np = document.createElement('p'); newN++;
  np.dataset.id = 'n' + newN; np.dataset.new = '1'; np.dataset.sec = p.dataset.sec || SEC[p.dataset.id]; np.dataset.num = nextNum(p);
  np.innerHTML = `<span class="ph">${np.dataset.num}&nbsp; New clause</span>`;
  p.after(np); hideGap(); orb.classList.remove('in'); if(orbP) orbP.classList.remove('hov');
  if(cur && cur!==np){ cur.classList.remove('sel'); dropIfEmpty(cur); }
  cur = np; np.classList.add('sel'); anchorX = null; anchorY = null; hideRec(true);
  openPrompt(prefill, fix);
}
gap.addEventListener('mousedown', e=>{ e.preventDefault(); e.stopPropagation(); if(e.target.closest('.plus') && gapP) insertAfter(gapP); });

/* 7. the ripple: a change here reaches a clause there. the edited clause gets a chip naming it; the reached clause gets a mark.
      click either → that clause's prompt opens with the follow-up already typed. once the reached clause changes, both go away. */
let ripples = [];
function addRipple(src, r){
  const tgt = document.querySelector(`p[data-id="${r.tgt || r.after}"]`); if(!tgt) return;
  const chip = document.createElement('i'); chip.className='also'; chip.textContent = 'Also affects ' + r.label;
  src.appendChild(chip);
  const dot = document.createElement('i'); dot.className='ripdot'; tgt.appendChild(dot);
  const rec = {src, tgt, r, chip, dot}; ripples.push(rec);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ chip.classList.add('in'); dot.classList.add('in'); }));
}
function clearRipple(src){ ripples = ripples.filter(x=>{ if(x.src!==src) return true; x.chip.remove(); x.dot.remove(); return false; }); }
function settleRipples(p){ ripples = ripples.filter(x=>{ const hit = x.tgt===p || (x.r.after && p.dataset.new && x.tgt===p.previousElementSibling); if(!hit) return true; x.chip.remove(); x.dot.remove(); return false; }); }
function followRipple(x){
  hideRec(true); hide(prompt);
  scrollDocTo(x.tgt);
  setTimeout(()=>{
    if(cur && cur!==x.tgt){ cur.classList.remove('sel'); dropIfEmpty(cur); }
    if(x.r.after){ insertAfter(x.tgt, null, x); return; }                  // the follow-up is a new definition, not an edit
    cur = x.tgt; cur.classList.add('sel'); anchorX = cur.getBoundingClientRect().right - 300; anchorY = null;
    openPrompt(null, x);
  }, 420);
}
page.addEventListener('mousedown', e=>{
  const el = e.target.closest('.also, .ripdot'); if(!el) return; e.preventDefault(); e.stopPropagation();
  const x = ripples.find(x=>x.chip===el || x.dot===el); if(x) followRipple(x);
});
page.addEventListener('mouseover', e=>{
  const el = e.target.closest('.also, .ripdot'); if(!el) return;
  const x = ripples.find(x=>x.chip===el || x.dot===el); if(!x) return;
  clearTimeout(recTimer); recP = null;
  rec.innerHTML = `<div class="rin one">${x.r.why} <b>Click to fix.</b></div>`; rec.classList.add('wide'); tipAt(el, rec); show(rec);
});
page.addEventListener('mouseout', e=>{ const el = e.target.closest('.also, .ripdot'); if(el){ recTimer = setTimeout(()=>{ hide(rec); rec.classList.remove('wide'); }, 200); } });

/* ---------- 8. the loop: the prototype plays itself until someone takes the mouse ----------
   nothing here is a recording. a fake cursor moves, and the real handlers run: the same selection, toolbar, prompt, redline, ripple and answer
   a reader gets by hand. move onto the document and it stops; leave for a few seconds and it starts again from a clean page. */
const fcur = document.createElement('div'); fcur.id='fcur';
fcur.innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22"><path d="M3 2l14.5 9.2-6.6 1.3 3.9 7-2.6 1.4-3.9-7.1L3.4 18z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="ring"></span>`;
document.body.appendChild(fcur);
const demobar = document.getElementById('demobar'), demohint = {set textContent(v){}}, stageEl = document.querySelector('.stage');
const demo = {token:0, running:false, driving:false, visible:false};
let fx = 0, fy = 0;
class Stop extends Error {}
const alive = t => { if(t !== demo.token) throw new Stop(); };
const PACE = 1.5;
const wait = (ms, t) => new Promise((res, rej) => setTimeout(() => t === demo.token ? res() : rej(new Stop()), ms * PACE));
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
let fh = null;
function fakeHover(clear){
  const el = clear ? null : document.elementFromPoint(fx, fy);
  const h = el && el.closest('.mitem, .abtn, .tbi, .tai, .also, .orb, .send, .ripdot');
  if(h !== fh){ if(fh) fh.classList.remove('fhover'); if(h) h.classList.add('fhover'); fh = h; }
}
function placeCursor(x, y){ fx = x; fy = y; ptrX = x; ptrY = y; fcur.style.transform = `translate(${x - 3}px, ${y - 2}px)`; fakeHover(); }
function glide(x, y, ms, t, onStep){ ms *= PACE;
  const x0 = fx, y0 = fy, t0 = performance.now();
  return new Promise((res, rej) => {
    const step = now => {
      if(t !== demo.token) return rej(new Stop());
      const k = Math.min(1, (now - t0)/ms), e = ease(k);
      placeCursor(x0 + (x - x0)*e, y0 + (y - y0)*e); if(onStep) onStep();
      k < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
const mid = (el, fxr=.5, fyr=.5) => { const r = el.getBoundingClientRect(); return [r.left + r.width*fxr, r.top + r.height*fyr]; };
async function goTo(el, t, ms=850, fxr=.5, fyr=.5){ const [x, y] = mid(el, fxr, fyr); await glide(x, y, ms, t); }
function fire(el, type){ el.dispatchEvent(new MouseEvent(type, {bubbles:true, cancelable:true, clientX:fx, clientY:fy})); }
async function press(el, t, type='mousedown'){
  fcur.classList.add('down'); const ring = fcur.querySelector('.ring'); ring.classList.remove('go'); void ring.offsetWidth; ring.classList.add('go');
  await wait(110, t); fire(el, type); fcur.classList.remove('down');
}
const Q = sel => document.querySelector(sel);
async function need(sel, t, ms=3000){ const t0 = performance.now(); while(!Q(sel)){ alive(t); if(performance.now() - t0 > ms) throw new Stop(); await wait(60, t); } return Q(sel); }
function quiet(){ orb.classList.remove('in'); if(orbP) orbP.classList.remove('hov'); hideGap(); }

function resetDoc(){
  timers.forEach(clearTimeout); timers = [];
  [prompt, card, rec].forEach(el => el.classList.remove('in','out','open','wide'));
  ripples.forEach(x => { x.chip.remove(); x.dot.remove(); }); ripples = [];
  quiet(); getSelection().removeAllRanges();
  renderDoc(); records = {}; cur = null; proposal = null; recP = null; recEdge = null; anchorX = null; anchorY = null;
  canvas.scrollTop = 0;
}

async function playOnce(t){
  const stR = stageEl.getBoundingClientRect();
  placeCursor(stR.right - 60, stR.bottom - 40); fcur.classList.add('in');

  /* 1 — ask AI to edit: drag over 8.1, toolbar, Ask AI, pick a suggestion, watch it land, hover the change for who and why */
  step(1, 17900);
  const k1 = Q('p[data-id="k1"]'); scrollDocTo(k1, true, .3); await wait(800, t);
  const tn = k1.firstChild, r0 = document.createRange(); r0.setStart(tn, 4); r0.setEnd(tn, 5);
  const a0 = r0.getBoundingClientRect(); await glide(a0.left, a0.top + a0.height/2, 1000, t);
  fcur.classList.add('down'); await wait(120, t);
  const [ex, ey] = (() => { const r = k1.getBoundingClientRect(); return [r.right - 60, r.top + 5 + 30]; })();   // end of the second line
  await glide(ex, ey, 1100, t, () => {
    const c = document.caretRangeFromPoint ? document.caretRangeFromPoint(fx, fy) : null;
    if(c && k1.contains(c.startContainer)) getSelection().setBaseAndExtent(tn, 4, c.startContainer, c.startOffset);
  });
  fcur.classList.remove('down'); fire(k1, 'mouseup');
  const ask = await need('#prompt [data-ai]', t); await wait(900, t);
  await goTo(ask, t, 700); await press(ask, t);
  const sug = await need('#prompt .mitem[data-sug="Make confidentiality mutual"]', t, 7000); await wait(900, t);
  await goTo(sug, t, 650, .35); await wait(1500, t);                                         // long enough to read the tag and where the wording came from
  await press(sug, t);
  await glide(fx + 180, fy + 40, 700, t);                                                     // step back and watch the words change
  const chip = await need('p[data-id="k1"] .also', t, 7000); await wait(900, t);
  const insEl = k1.querySelector('ins'); const ir = insEl.getClientRects()[0];
  await glide(ir.left + ir.width*.5, ir.top + ir.height/2, 750, t); fire(insEl, 'mouseover'); quiet(); await wait(2400, t);
  fire(insEl, 'mouseout'); quiet();

  /* 2 — see what else it touches: the chip, why, click, the prompt opens on 1.1 already typed, send, both marks go */
  step(2, 9500);
  await goTo(chip, t, 750); fire(chip, 'mouseover'); quiet(); await wait(2600, t);
  await press(chip, t); quiet();
  const fixrow = await need('#prompt.in .fixrow', t, 3000); await wait(1800, t);                // read why it opened here
  await goTo(fixrow, t, 700, .3); await wait(500, t); await press(fixrow, t);
  await glide(fx + 120, fy + 60, 700, t);
  const d1 = Q('p[data-id="d1"]'); while(!d1.classList.contains('was')){ alive(t); await wait(80, t); }
  await wait(2200, t);

  /* 3 — ask before you change: hover 5.2, the orbit, a question, an answer from your own contracts, keep it */
  step(3, 12900);
  const c2 = Q('p[data-id="c2"]'); scrollDocTo(c2, true, .12); await wait(800, t);
  await goTo(c2, t, 850, .6, .5); fire(c2, 'mouseover'); await wait(450, t);
  await goTo(orb, t, 500); await press(orb, t);
  const qi = await need('#prompt .mitem[data-sug="Is 60 days market?"]', t, 7000); await wait(900, t);
  await goTo(qi, t, 600, .3); await wait(500, t); await press(qi, t);
  await glide(fx + 60, fy + 140, 800, t);
  const keep = await need('#prompt .aans ~ .aacts [data-keep]', t, 7000); await wait(3800, t);   // time to read the answer
  await goTo(keep, t, 700); await wait(400, t); await press(keep, t);
  await wait(900, t);

  /* reset, quietly */
  await glide(stR.right - 60, stR.bottom - 40, 900, t);
  step(4, 0); page.classList.add('fade'); await wait(500, t);
  resetDoc(); await wait(150, t); page.classList.remove('fade'); await wait(1100, t);
}
async function loop(){
  if(demo.running) return;
  demo.running = true; demo.driving = false; const t = ++demo.token;
  barPlaying(); resetDoc();
  try { while(true){ await playOnce(t); } }
  catch(e){ if(!(e instanceof Stop)) console.error(e); }
}
function stopDemo(reason){
  demo.token++; demo.running = false; fcur.classList.remove('in','down'); fakeHover(true);
  document.documentElement.classList.remove('demoing');
  if(reason === 'driving') demo.driving = true;
}
if(document.documentElement.classList.contains('embed')){
  const post = () => parent.postMessage({unit:'editor', h:document.querySelector('.unit').getBoundingClientRect().height + 2}, '*');
  addEventListener('load', post); new ResizeObserver(post).observe(document.body);
}
/* only play while the reader can see it */
if(!matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window){
  new IntersectionObserver(([en]) => {
    demo.visible = en.intersectionRatio >= .45 || en.intersectionRect.height >= 360;
    if(demo.visible && !demo.running && !demo.driving && !demo.started){ demo.started = true; loop(); }
  }, {threshold:[0, .2, .3, .45, .6, .8]}).observe(stageEl);
} else { barTrying(); }

/* ---------- one line for the whole run ---------- */
const STEPL = ['Ask AI to edit','See what else it touches','Ask before you change'], STEPD = [17900,9500,12900], STEPT = STEPD.reduce((a,b)=>a+b,0);
const dfill = document.getElementById('dfill'), dlab = document.getElementById('dlab'), dtry = document.getElementById('dtry');
var UNIT = 'editor'; function tell(m){ try { parent.postMessage(Object.assign({unit:UNIT}, m), '*'); } catch(e){} }
function step(n, dur){
  if(n > STEPL.length){ dfill.style.transition = 'width .5s ease'; dfill.style.width = '100%'; tell({kind:'step', n, a:1, b:1, dur:500}); return; }
  const a = STEPD.slice(0, n-1).reduce((x,y)=>x+y,0) / STEPT, b = a + dur / STEPT;
  dfill.style.transition = 'none'; dfill.style.width = (a*100) + '%'; void dfill.offsetWidth;
  dfill.style.transition = 'width ' + (dur * PACE) + 'ms linear'; dfill.style.width = (b*100) + '%';
  dlab.innerHTML = '<b>0' + n + '</b>' + STEPL[n-1];
  tell({kind:'step', n, of:STEPL.length, label:STEPL[n-1], a, b, dur:dur * PACE});
}
function barPlaying(){ demobar.classList.remove('trying'); document.documentElement.classList.add('demoing'); dtry.textContent = 'I want to try this myself'; tell({kind:'state', playing:true}); }
function barTrying(){ demobar.classList.add('trying'); document.documentElement.classList.remove('demoing'); dtry.textContent = 'Play the demo'; dlab.innerHTML = 'You&rsquo;re trying it. The demo comes back a few seconds after you leave.'; tell({kind:'state', playing:false}); }

/* while the demo plays, a real hand does nothing to the prototype: it has to ask to take over */
['pointerdown','pointerup','pointermove','pointerover','pointerout','mousedown','mouseup','mousemove','mouseover','mouseout','click','dblclick','contextmenu'].forEach(type =>
  document.addEventListener(type, e => {
    if(!e.isTrusted || !demo.running) return;
    if(e.target.closest && e.target.closest('#demobar')) return;
    e.stopImmediatePropagation(); if(type === 'mousedown' || type === 'click' || type === 'contextmenu') e.preventDefault();
  }, true));

/* taking over, and giving it back */
let idleTimer = null;
const IDLE = 6000;
function armIdle(){ clearTimeout(idleTimer); idleTimer = setTimeout(() => { if(demo.driving && demo.visible && !inside){ demo.driving = false; loop(); } }, IDLE); }
let inside = false;
/* a click on the frame: the demo stops and the reader starts from the beginning, with nothing playing over them */
function tryNow(){ demo.started = true; if(demo.running) stopDemo(); clearTimeout(idleTimer); demo.driving = false; resetDoc(); barTrying(); }
addEventListener('message', e => { if(e.data && e.data.cmd === 'resume'){ if(!demo.running){ clearTimeout(idleTimer); demo.driving = false; loop(); } return; } if(e.data && e.data.cmd === 'try') return tryNow(); if(e.data && e.data.cmd === 'toggle') dtry.click(); });
dtry.addEventListener('click', e => {
  e.stopPropagation();
  if(demo.running){ stopDemo('driving'); barTrying(); }
  else { clearTimeout(idleTimer); demo.driving = false; loop(); }
});
document.addEventListener('pointermove', e => { if(!e.isTrusted) return; inside = true; if(demo.driving) clearTimeout(idleTimer); }, true);
document.addEventListener('keydown', () => { if(demo.driving) clearTimeout(idleTimer); }, true);
document.documentElement.addEventListener('mouseleave', () => { inside = false; if(demo.driving) armIdle(); });
document.addEventListener('focusout', () => { if(demo.driving && !inside) armIdle(); });
</script>
</body>
</html>
